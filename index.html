<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureCut — In-Browser AI Background Remover</title>
    <meta name="description" content="Fast, 100% private in-browser AI image background removal. No accounts, no watermarks." />
    <script src="./coi-serviceworker.js"></script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('purecut_font_size') || 'normal';
          document.documentElement.setAttribute('data-font-size', saved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
